<html>

  html, body { width: 1200px; height: 630px; }
  body {
    font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    display: flex;
    align-items: stretch;
    background: #f1f4f8;
    color: #0f1729;
  }
  .left {
    flex: 1;
    min-width: 0;
    padding: 76px 64px 66px 92px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.005em;
  }
  .brand svg { width: 38px; height: 38px; color: #c00f2b; }
  h1 {
    margin-top: 44px;
    font-size: 84px;
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -0.037em;
    max-width: 640px;
  }
  .sub {
    margin-top: 24px;
    font-size: 28px;
    line-height: 1.42;
    font-weight: 450;
    color: #4d5769;
    max-width: 600px;
  }
  .chips { margin-top: 34px; display: flex; gap: 12px; }
  .chip {
    padding: 12px 24px;
    background: #fff;
    border: 1px solid #dfe5ef;
    border-radius: 999px;
    font-size: 22px;
    font-weight: 600;
    color: #0f1729;
  }
  .url {
    margin-top: auto;
    padding-top: 38px;
    font-size: 24px;
    font-weight: 650;
    color: #78829a;
    letter-spacing: -0.005em;
  }
  .right {
    width: 430px;
    flex: none;
    position: relative;
    background: #c00f2b;
  }
  .right svg {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 302px;
    height: 302px;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="card">

      <div class="brand"><span data-leaf></span> Prepare Citizenship</div>
      <h1>Practice for the citizenship test</h1>
      <p class="sub">Read a chapter, drill the flashcards, then sit a timed mock exam.</p>
      <div class="chips">
        <span class="chip">Free</span>
        <span class="chip">No account</span>
        <span class="chip">Works offline</span>
      </div>
      <div class="url">preparecitizenship.ca</div>
    </div>
    <div class="right"><span data-leaf></span></div>
